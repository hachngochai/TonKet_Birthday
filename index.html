<body><div class="hud"><header class="top"><div class="logo">✦ KIỆT'S <span>BIRTHDAY UNIVERSE</span></div><div class="actions"><button id="music" class="pill">♫ NHẠC</button><button id="look" class="pill">◎ 360°</button><span id="vr"></span></div></header><section class="left fade" id="story"><div class="label" id="tag">01 / MÓN QUÀ BÍ MẬT</div><h1 id="title">Một vũ trụ<em>dành riêng cho Kiệt.</em></h1><p id="desc">Có một món quà rất đặc biệt đang chờ anh mở. Hãy bước vào thế giới của riêng mình!</p><button class="mainbtn" id="act">MỞ MÓN QUÀ ✦</button></section><div class="vrnote">KÉO ĐỂ XOAY • CUỘN ĐỂ ZOOM • CHẠM ĐỂ KHÁM PHÁ</div><footer class="bottom"><div class="hint">IMMERSIVE BIRTHDAY EXPERIENCE · THREE.JS</div><div class="steps" id="steps"></div><div class="nav"><button class="navbtn" id="prev">←</button><button class="navbtn" id="next">→</button></div></footer></div><div id="modal"><div class="card"><button class="pill" id="close">✕</button><div id="modalBody"></div></div></div>
<script type="module">
import * as T from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{VRButton}from'three/addons/webxr/VRButton.js';
const $=x=>document.querySelector(x),pages=[
['01 / MÓN QUÀ BÍ MẬT','Một vũ trụ','dành riêng cho Kiệt.','Có một món quà đặc biệt đang chờ anh mở. Hãy bắt đầu hành trình!','MỞ MÓN QUÀ ✦'],
['02 / ĐẢO SINH NHẬT','Chào mừng','Chu Tuấn Kiệt!','Khám phá hòn đảo sinh nhật với ngôi sao, bóng bay và nhân vật của riêng anh.','KHÁM PHÁ TIẾP →'],
['03 / NHÂN VẬT ĐẶC BIỆT','Xin chào','anh Kiệt!','Một phiên bản chibi ngộ nghĩnh với mái tóc đen và chiếc áo xanh thân quen.','XEM KỶ NIỆM →'],
['04 / THẾ GIỚI 360°','Xoay quanh','những điều đẹp nhất.','Dùng chuột hoặc vuốt để khám phá mọi góc của vũ trụ sinh nhật.','ĐẾN BÁNH SINH NHẬT →'],
['05 / ĐIỀU ƯỚC','Ước một điều','thật tuyệt vời!','Hãy thổi những ngọn nến, gửi điều ước của anh đến những vì sao.','THỔI NẾN 🎂'],
['06 / HAPPY BIRTHDAY','Chúc mừng','Chu Tuấn Kiệt!','Chúc anh luôn vui vẻ, khỏe mạnh, may mắn, học tập và công việc thuận lợi, tuổi mới thật rực rỡ!','ĐỌC LỜI CHÚC 💌']];
let stage=0,blown=false,elapsed=0,burst=[],musicOn=false,audio,playing=false;
const scene=new T.Scene();scene.background=new T.Color(0x06152a);scene.fog=new T.FogExp2(0x06152a,.018);
const camera=new T.PerspectiveCamera(55,innerWidth/innerHeight,.1,250);camera.position.set(8,5,13);
const renderer=new T.WebGLRenderer({antialias:true,alpha:false});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.outputColorSpace=T.SRGBColorSpace;renderer.xr.enabled=true;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=4;controls.maxDistance=28;controls.maxPolarAngle=Math.PI*.81;controls.target.set(2,1,0);
scene.add(new T.HemisphereLight(0x8bf6f5,0x1d274c,2.6));const light=new T.DirectionalLight(0xffe7b6,3.5);light.position.set(-5,12,8);light.castShadow=true;light.shadow.mapSize.set(1024,1024);scene.add(light);const glow=new T.PointLight(0x5bdeec,60,26);glow.position.set(3,6,5);scene.add(glow);
const mat=(c,metal=0)=>new T.MeshStandardMaterial({color:c,roughness:.55,metalness:metal});
function mesh(g,m,x=0,y=0,z=0,parent=scene){const o=new T.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function ball(r,c,x,y,z,parent=scene){return mesh(new T.SphereGeometry(r,16,12),mat(c),x,y,z,parent)}
function box(w,h,d,c,x,y,z,parent=scene){return mesh(new T.BoxGeometry(w,h,d),mat(c),x,y,z,parent)}
const world=new T.Group();scene.add(world);
mesh(new T.CylinderGeometry(4.8,4.1,1.15,8),mat(0x389862),3,-.75,0,world);mesh(new T.CylinderGeometry(4.7,4.7,.26,8),mat(0x6acc78),3,-.07,0,world);
const avatar=new T.Group();avatar.position.set(3,0,0);world.add(avatar);
box(.86,1.25,.55,0x2269da,0,1.3,0,avatar);ball(.67,0xffd5b2,0,2.36,0,avatar);const hair=ball(.70,0x131624,0,2.74,-.03,avatar);hair.scale.set(1,.52,1);for(let i=-2;i<=2;i++)ball(.14,0x131624,i*.23,2.77,.48,avatar);
for(let s of [-1,1]){box(.3,.96,.32,0x216dda,s*.64,1.32,0,avatar).rotation.z=s*.17;box(.31,.77,.36,0x182e64,s*.25,.43,0,avatar);ball(.17,0xffffff,s*.25,.065,.09,avatar);ball(.065,0x151b2b,s*.22,2.39,.6,avatar)}const smile=mesh(new T.TorusGeometry(.19,.025,8,20,Math.PI),mat(0xb76a56),0,2.16,.61,avatar);smile.rotation.z=Math.PI;
const cake=new T.Group();cake.position.set(6.2,.08,1.3);world.add(cake);mesh(new T.CylinderGeometry(1,1,.6,32),mat(0xffaac9),0,.38,0,cake);mesh(new T.CylinderGeometry(.75,.78,.52,32),mat(0xfff6e8),0,.94,0,cake);mesh(new T.CylinderGeometry(.53,.56,.38,32),mat(0xfabbd7),0,1.39,0,cake);let flames=[];for(let i=0;i<5;i++){let x=Math.sin(i*6.283/5)*.36,z=Math.cos(i*6.283/5)*.36;mesh(new T.CylinderGeometry(.045,.045,.37,8),mat([0x52e9d9,0xe8cb67,0xffb2be][i%3]),x,1.79,z,cake);const f=mesh(new T.SphereGeometry(.087,10,8),new T.MeshBasicMaterial({color:0xffc450}),x,2.05,z,cake);f.scale.y=1.65;flames.push(f)}
const gift=new T.Group();gift.position.set(3,.6,3);world.add(gift);box(1.4,1.15,1.4,0x9c73ff,0,0,0,gift);box(.18,1.18,1.45,0xffd26c,0,0,.01,gift);box(1.45,1.18,.18,0xffd26c,0,0,0,gift);const lid=box(1.65,.23,1.65,0xdba5ff,0,.7,0,gift);
for(let i=0;i<16;i++){const angle=i*Math.PI*2/16,r=3.3+Math.random();ball(.09+Math.random()*.2,[0x91efd5,0xf9df82,0xffadd7,0x98b7ff][i%4],3+Math.sin(angle)*r,.25+Math.random()*4,Math.cos(angle)*r,world)}
const stars=new T.BufferGeometry(),pts=new Float32Array(750*3);for(let i=0;i<750;i++){pts[3*i]=(Math.random()-.5)*120;pts[3*i+1]=(Math.random()-.5)*80;pts[3*i+2]=(Math.random()-.5)*120}stars.setAttribute('position',new T.BufferAttribute(pts,3));scene.add(new T.Points(stars,new T.PointsMaterial({color:0xb6fbff,size:.075,sizeAttenuation:true})));
const balloons=[];for(let i=0;i<22;i++){const p=new T.Group(),a=i*Math.PI*.618,r=3+Math.random()*6;p.position.set(3+Math.sin(a)*r,1.3+Math.random()*3,Math.cos(a)*r);let o=ball(.35,[0x86eafa,0xff9ac5,0xffd072,0xb7a2fc][i%4],0,0,0,p);o.scale.set(.82,1.3,.82);mesh(new T.CylinderGeometry(.01,.01,.85,3),mat(0xf1e5ec),0,-.72,0,p);world.add(p);balloons.push({p,y:p.position.y,offset:i})}
const floor=mesh(new T.PlaneGeometry(250,250),mat(0x07152b),0,-3,0);floor.rotation.x=-Math.PI/2;
function confetti(n=120){for(let i=0;i<n;i++){let b=box(.055,.055,.055,[0x7df9d6,0xffdd79,0xfc98c0,0x96b0fc][i%4],3+(Math.random()-.5)*6,2+Math.random()*6,(Math.random()-.5)*5);burst.push({b,v:new T.Vector3((Math.random()-.5)*.12,.08+Math.random()*.12,(Math.random()-.5)*.12),life:150+Math.random()*80})}}
function ui(){let p=pages[stage];$('#tag').textContent=p[0];$('#title').innerHTML=p[1]+'<em>'+p[2]+'</em>';$('#desc').textContent=p[3];$('#act').textContent=p[4];document.querySelectorAll('.step').forEach((b,i)=>b.classList.toggle('active',i===stage));$('#story').classList.remove('fade');void $('#story').offsetWidth;$('#story').classList.add('fade');world.visible=stage!==3;controls.target.set(stage===3?3:2,stage===3?2:1,0);if(stage===3){world.visible=true;camera.position.set(3,3,11)}if(stage===5)confetti(220);gift.visible=stage===0||stage===1;cake.visible=stage===4||stage===5;avatar.visible=stage>0;}
function go(i){stage=Math.max(0,Math.min(5,i));ui()}function wish(){if(blown){go(5);return}blown=true;flames.forEach(f=>f.visible=false);playTone(523,.12);setTimeout(()=>playTone(659,.15),160);setTimeout(()=>playTone(783,.2),320);confetti(200);setTimeout(()=>go(5),1100)}
const steps=$('#steps');pages.forEach((p,i)=>{let b=document.createElement('button');b.className='step';b.title=p[0];b.onclick=()=>go(i);steps.append(b)});
$('#act').onclick=()=>{if(stage===4)wish();else if(stage===5)showWish();else if(stage===0){lid.position.y=1.7;lid.rotation.z=.5;confetti(100);setTimeout(()=>go(1),700)}else go(stage+1)};
$('#prev').onclick=()=>go(stage-1);$('#next').onclick=()=>go(stage+1);$('#look').onclick=()=>go(3);$('#close').onclick=()=>$('#modal').style.display='none';$('#modal').onclick=e=>{if(e.target===$('#modal'))$('#modal').style.display='none'};
function showWish(){const d=$('#modalBody');d.replaceChildren();d.innerHTML='<h2>💌 Gửi Chu Tuấn Kiệt</h2><p>Chúc anh tuổi mới tràn đầy niềm vui, nhiều sức khỏe, may mắn và những chuyến đi đáng nhớ. Mong rằng mỗi ngày đều có một lý do để mỉm cười, mỗi thử thách đều là cơ hội để trưởng thành. Happy Birthday, anh Kiệt! 🎂</p><p class="tiny">Với tất cả những lời chúc tốt đẹp nhất ✨</p>';$('#modal').style.display='flex'}
function playTone(f,d){if(!musicOn)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.03,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch{}}
$('#music').onclick=()=>{musicOn=!musicOn;$('#music').textContent=musicOn?'♫ ĐANG BẬT':'♫ NHẠC';if(musicOn){playTone(523,.2);setTimeout(()=>playTone(659,.25),210)}};
renderer.xr.addEventListener('sessionstart',()=>controls.enabled=false);renderer.xr.addEventListener('sessionend',()=>controls.enabled=true);
if(navigator.xr?.isSessionSupported){navigator.xr.isSessionSupported('immersive-vr').then(ok=>{if(ok){const v=VRButton.createButton(renderer);v.style.position='static';v.style.padding='10px';v.style.borderRadius='30px';v.style.fontSize='11px';$('#vr').append(v)}}).catch(()=>{})}
const mouse=new T.Vector2(),ray=new T.Raycaster();renderer.domElement.addEventListener('pointerup',e=>{if(Math.abs(e.movementX)>10)return;mouse.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects([gift,avatar,cake],true);if(!hits.length)return;let p=hits[0].object;while(p.parent&&p.parent!==world)p=p.parent;if(p===gift&&stage===0)$('#act').click();else if(p===cake&&stage===4)wish();else if(p===avatar){avatar.rotation.y+=.5;confetti(35)}});
renderer.setAnimationLoop(()=>{elapsed+=.016;controls.update();world.rotation.y=stage===3?Math.sin(elapsed*.04)*.1:0;balloons.forEach(({p,y,offset})=>p.position.y=y+Math.sin(elapsed+offset)*.15);avatar.position.y=Math.sin(elapsed*2)*.06;flames.forEach((f,i)=>{f.scale.y=1.4+Math.sin(elapsed*8+i)*.35});for(let i=burst.length-1;i>=0;i--){const q=burst[i];q.b.position.add(q.v);q.v.y-=.003;q.life--;q.b.rotation.x+=.06;if(q.life<=0){scene.remove(q.b);q.b.geometry.dispose();q.b.material.dispose();burst.splice(i,1)}}renderer.render(scene,camera)});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});ui();
</script></body></html>
